<!DOCTYPE html>

<style>
body{margin:0!important;padding:0!important;width:100%!important;}
a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;}
@media only screen and (max-width:620px){
 .wrap{width:100%!important;}
 .card{padding:28px 22px!important;border-radius:0!important;}
 .stack{display:block!important;width:100%!important;padding:0 0 12px 0!important;}
 .nps a{width:24px!important;font-size:13px!important;}
 .hide-sm{display:none!important;}
 .kpi{display:block!important;width:100%!important;padding:0 0 12px 0!important;}
}
@media (prefers-color-scheme:dark){
 .bg{background-color:#16232c!important;}
 .foot,.foot a{color:#a9b8c4!important;}
 .logo-light{display:none!important;}
 .logo-dark{display:block!important;}
}
</style>
</head>
<body class="bg" style="margin:0;padding:0;background-color:#e0edf5;">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#e0edf5;opacity:0;">{{.Preheader}}&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;</div>

<tr><td style="padding:32px 8px 24px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"><tr>
<td valign="middle"><a href="https://careli.de" style="text-decoration:none;"><img class="logo-light" src="cid:careli-logo-pink" width="119" height="32" alt="careli." style="display:block;width:119px;height:32px;border:0;outline:none;font-family:Manrope,Arial,Helvetica,sans-serif;font-size:24px;font-weight:800;color:#ff4f79;"><img class="logo-dark" src="cid:careli-logo-white" width="119" height="32" alt="careli." style="display:none;width:119px;height:32px;border:0;outline:none;font-family:Manrope,Arial,Helvetica,sans-serif;font-size:24px;font-weight:800;color:#ffffff;"></a></td>

</tr></table></td></tr>
<tr><td class="card" bgcolor="#ffffff" style="background-color:#ffffff;border:1px solid #e3e4dd;border-radius:24px;padding:40px;">
<p style="margin:0 0 12px;font-family:Manrope,Arial,Helvetica,sans-serif;font-size:12px;line-height:16px;mso-line-height-rule:exactly;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#ff4f79;">{{.Section}}</p>
<h1 style="margin:0 0 16px;font-family:Manrope,Arial,Helvetica,sans-serif;font-size:28px;line-height:36px;mso-line-height-rule:exactly;font-weight:800;letter-spacing:-0.5px;color:#2b6c8c;">{{.Title}}</h1>
